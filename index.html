<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Quote of the Moment</h1>

    <div class="tabs">
      <button id="tab-funny" class="active" onclick="setMood('funny')">😄 Funny</button>
      <button id="tab-life" onclick="setMood('life')">🍃 Life</button>
    </div>

    <span id="mood-badge" class="mood-badge">😄 Funny</span>

    <div id="quote-wrap">
      <p id="quote-text"></p>
      <p id="quote-author"></p>
    </div>

    <div class="actions">
      <button id="fav-btn" onclick="toggleFav()">🤍 <span id="fav-label">Save</span></button>
      <button onclick="copyQuote()">📋 <span id="copy-label">Copy</span></button>
      <button onclick="shareQuote()">🐦 Share</button>
      <button onclick="nextQuote()">Next Quote →</button>
    </div>

    <div id="fav-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
